<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="William Osei-Hwere — portfolio archive." />
  <title>William Osei-Hwere — Archive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="archive" aria-label="William Osei-Hwere portfolio archive">
    <div class="field-line" aria-hidden="true"></div>
    <div class="corner corner-a" aria-hidden="true"></div>
    <div class="corner corner-b" aria-hidden="true"></div>

    <header class="masthead">
      <a class="monogram" href="/" aria-label="William Osei-Hwere home">W·O–H</a>
      <p class="edition">PORTFOLIO / ARCHIVE</p>
    </header>

    <section class="movement" aria-labelledby="archive-title">
      <div class="dial" aria-hidden="true">
        <div class="ticks"></div>
        <div class="inner-ring"></div>
        <div class="pitch-ring"></div>
        <div class="hand hand-long"></div>
        <div class="hand hand-short"></div>
        <div class="pin"></div>
      </div>

      <div class="center-copy">
        <span class="index-mark">est 06</span>
        <h1 id="archive-title">Choose<br />a season</h1>
        <p>Osei-Hwere William</p>
        <p>Choose.</p>
      </div>

      <nav class="seasons" aria-label="Portfolio versions">
        <a class="season season-25" href="/summer25/" data-angle="226">
          <span class="season-kicker">first XI</span>
          <span class="season-year">25</span>
          <span class="season-label">summer</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <a class="season season-26" href="/summer26/" data-angle="46">
          <span class="season-kicker">next XI</span>
          <span class="season-year">26</span>
          <span class="season-label">summer</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </section>

    <footer class="footer-note">
      <span>WILLIAM OSEI-HWERE</span>
      <span class="ball-mark" aria-hidden="true">⬡</span>
      <span>SELECT / ENTER</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
